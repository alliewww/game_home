<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- 濾鏡定義 -->
  <defs>
    <!-- 圓形陰影 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0, 0, 0, 0.2)"/>
    </filter>
    
    <!-- 徑向漸層：中心發光效果 -->
    <radialGradient id="radialGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#EEEDE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0CFC8;stop-opacity:1" />
    </radialGradient>
    
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#radialGradient)"/>

  <!-- 1-3 -->
  <rect x="0" y="0" width="130" height="130" rx="20" ry="20" 
    fill="#cdcbd1" 
    stroke="#677178" 
    stroke-width="4" stroke-opacity="0.4" 
    transform="translate(30, 34)  rotate(-10, 60, 60)"
    filter="url(#shadow)"/>
  <text x="60" y="60" font-family="Courier New" opacity="0.4" 
    transform="translate(38, 44) rotate(-10, 60, 60)"
    font-size="100" fill="#677178" text-anchor="middle" dominant-baseline="middle">0</text>

  <rect x="0" y="0" width="130" height="130" rx="20" ry="20" 
    fill="#cdcbd1" 
    stroke="#677178" 
    stroke-width="4" stroke-opacity="0.4" 
    transform="translate(140, 30)  rotate(5, 60, 60)"
    filter="url(#shadow)"/>
  <text x="60" y="60" font-family="Courier New" opacity="0.4" 
    transform="translate(144, 40) rotate(5, 60, 60)"
    font-size="100" fill="#677178" text-anchor="middle" dominant-baseline="middle">0</text>

  <rect x="0" y="0" width="130" height="130" rx="20" ry="20" 
    fill="#cdcbd1" 
    stroke="#677178" 
    stroke-width="4" stroke-opacity="0.4" 
    transform="translate(244, 36)  rotate(-20, 60, 60)"
    filter="url(#shadow)"/>
  <text x="60" y="60" font-family="Courier New" opacity="0.4" 
    transform="translate(260, 46) rotate(-20, 60, 60)"
    font-size="100" fill="#677178" text-anchor="middle" dominant-baseline="middle">1</text>


  
  
  <!-- 4-6 -->
  <rect x="0" y="0" width="130" height="130" rx="20" ry="20" 
    fill="#cdcbd1" 
    stroke="#677178" 
    stroke-width="4" stroke-opacity="0.4" 
    transform="translate(20, 138)  rotate(10, 60, 60)"
    filter="url(#shadow)"/>
  <text x="60" y="60" font-family="Courier New" opacity="0.4" 
    transform="translate(16, 148) rotate(10, 60, 60)"
    font-size="100" fill="#677178" text-anchor="middle" dominant-baseline="middle">0</text>


  <rect x="0" y="0" width="130" height="130" rx="20" ry="20" 
    fill="#cdcbd1" 
    stroke="#677178" 
    stroke-width="4" stroke-opacity="0.4" 
    transform="translate(252, 130)  rotate(10, 60, 60)"
    filter="url(#shadow)"/>
  <text x="60" y="60" font-family="Courier New" opacity="0.4" 
    transform="translate(260, 148) rotate(10, 60, 60)"
    font-size="100" fill="#677178" text-anchor="middle" dominant-baseline="middle">1</text>


  <!-- 7-9 -->
  <rect x="0" y="0" width="130" height="130" rx="20" ry="20" 
    fill="#cdcbd1" 
    stroke="#677178" 
    stroke-width="4" stroke-opacity="0.4" 
    transform="translate(30, 240)  rotate(-12, 60, 60)"
    filter="url(#shadow)"/>
  <text x="60" y="60" font-family="Courier New" opacity="0.4" 
    transform="translate(34, 250) rotate(-12, 60, 60)"
    font-size="100" fill="#677178" text-anchor="middle" dominant-baseline="middle">0</text>

  <rect x="0" y="0" width="130" height="130" rx="20" ry="20" 
    fill="#cdcbd1" 
    stroke="#677178" 
    stroke-width="4" stroke-opacity="0.4" 
    transform="translate(140, 240)  rotate(5, 60, 60)"
    filter="url(#shadow)"/>
  <text x="60" y="60" font-family="Courier New" opacity="0.4" 
    transform="translate(146, 246) rotate(5, 60, 60)"
    font-size="100" fill="#677178" text-anchor="middle" dominant-baseline="middle">1</text>

  <rect x="0" y="0" width="130" height="130" rx="20" ry="20" 
    fill="#cdcbd1" 
    stroke="#677178" 
    stroke-width="4" stroke-opacity="0.4" 
    transform="translate(250, 238)  rotate(-5, 60, 60)"
    filter="url(#shadow)"/>
  <text x="60" y="60" font-family="Courier New" opacity="0.4" 
    transform="translate(256, 250) rotate(-5, 60, 60)"
    font-size="100" fill="#677178" text-anchor="middle" dominant-baseline="middle">0</text>
  
  
  




  <!-- 42 -->

  <rect x="0" y="0" width="230" height="230" rx="20" ry="20" 
    fill="#EACA6D" 
    stroke="#575b5e" stroke-dasharray="20,6"
    stroke-width="5" stroke-opacity="1" 
    transform="translate(84, 84)  rotate(0, 80, 80)"
    filter="url(#shadow)"/>
  <text x="60" y="60" font-family="Georgia" font-weight="500"
    transform="translate(134, 120) rotate(0, 60, 60)"
    font-size="160" fill="#575b5e" text-anchor="middle" dominant-baseline="middle">42</text>


