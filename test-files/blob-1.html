<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <title>GSAP 圓形切片分裂：1→2→4</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #0f1220;
            color: #eaf2ff;
            font-family: ui-sans-serif, system-ui;
        }

        :root {
            --firstColor: #00D69C;
            --secondColor: #C52AFC;
            --thirdColor: #FF1F00;
            --fourthColor: #FFD600;
        }

        .wrap {
            display: grid;
            place-items: center;
            height: 100%;
            gap: 18px;
        }

        #ui {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 12px;
            border: 0;
            border-radius: 10px;
            background: #2b2f55;
            color: #eaf2ff;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.1);
        }

        svg {
            overflow: visible;
        }

        .slice {
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35));
        }
    </style>
</head>

<body>
    <div class="wrap">
        <svg id="svg" width="360" height="360" viewBox="0 0 360 360">
            <path>

                <animate attributeName="d" dur="7s" repeatCount="indefinite"
                    values="M431.3 121.9c22 40.1 11.3 97.5 13.3 146.9 2 49.5 16.6 91.1 4.3 121.8-12.2 30.6-51.3 50.4-88.5 55.1-37.1 4.7-72.4-5.7-108.8-17.1-36.5-11.3-74.1-23.7-104-52-29.9-28.2-52-72.4-48.4-115.4 3.5-43 32.7-84.8 70.5-122.2 37.7-37.3 84-70.2 134.5-75.1 50.4-5 105.1 17.9 127.1 58z;M404.4 176.7c20.9 16.4 20.8 58.8 38.8 106.2 18.1 47.4 54.4 99.7 40.9 123.6-13.5 23.9-76.7 19.3-131.6 40.4-54.8 21-101.2 67.7-150.5 71.7-49.4 4.1-101.7-34.5-107.8-81.9C88 389.2 128 333 144.2 278c16.2-55.1 8.5-108.8 30.5-125 22-16.1 73.7 5.5 120.4 11.3 46.7 5.9 88.5-3.9 109.3 12.4z;M431.3 121.9c22 40.1 11.3 97.5 13.3 146.9 2 49.5 16.6 91.1 4.3 121.8-12.2 30.6-51.3 50.4-88.5 55.1-37.1 4.7-72.4-5.7-108.8-17.1-36.5-11.3-74.1-23.7-104-52-29.9-28.2-52-72.4-48.4-115.4 3.5-43 32.7-84.8 70.5-122.2 37.7-37.3 84-70.2 134.5-75.1 50.4-5 105.1 17.9 127.1 58z;">
                </animate>


            </path>
        </svg>
    </div>

    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script>
        // 使用GSAP为SVG路径添加颜色动画
        const style = getComputedStyle(document.documentElement);
        const colors = [
            style.getPropertyValue('--firstColor').trim(),
            style.getPropertyValue('--secondColor').trim(),
            style.getPropertyValue('--thirdColor').trim(),
            style.getPropertyValue('--fourthColor').trim()
        ];

        const tl = gsap.timeline({ repeat: -1, yoyo: true });
        colors.forEach(color => {
            tl.to("path", { fill: color, duration: 2, ease: "none" });
        });
    </script>
</body>

</html>
