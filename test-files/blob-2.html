<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>防重叠SVG泡泡分裂动画</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        #container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        #bubbleContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #333;
            border-radius: 50%;
            overflow: hidden;
        }

        button {
            margin-top: 420px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <svg id="svg" viewBox="0 0 1000 1000">
        <rect x="0" y="0" width="1000" height="1000" fill="red" clip-path="url(#blobmasking)" />
        <clipPath id="blobmasking">
            <path id="blob"></path>
        </clipPath>
    </svg>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
    <script>
        const blob1 = createBlob({
            element: document.querySelector('#blob'),
            numPoints: 8,
            centerX: 500,
            centerY: 500,
            minRadius: 400,
            maxRadius: 455,
            minDuration: 1,
            maxDuration: 2
        })

        TweenMax.to(blob1.tl, 0.5, {
            timeScale: 1,
            onStart() {
                blob1.tl.play()
            }
        });

        function createBlob(options) {
            const points = []
            const path = options.element
            const slice = (Math.PI * 2) / options.numPoints
            const startAngle = random(Math.PI * 2)

            const tl = new TimelineMax({
                onUpdate: update,
                paused: true
            })

            for (let i = 0; i < options.numPoints; i++) {
                const angle = startAngle + i * slice
                const duration = random(options.minDuration, options.maxDuration)

                const point = {
                    x: options.centerX + Math.cos(angle) * options.minRadius,
                    y: options.centerY + Math.sin(angle) * options.minRadius
                }

                const tween = TweenMax.to(point, duration, {
                    x: options.centerX + Math.cos(angle) * options.maxRadius,
                    y: options.centerY + Math.sin(angle) * options.maxRadius,
                    repeat: -1,
                    yoyo: true,
                    ease: Sine.easeInOut
                })

                tl.add(tween, -random(duration))
                points.push(point)
            }

            options.tl = tl
            options.points = points

            tl.progress(1).progress(0).timeScale(0)
            update()

            function update() {
                path.setAttribute('d', cardinal(points, true, 1))
            }

            return options
        }

        // Cardinal spline - a uniform Catmull-Rom spline with a tension option
        function cardinal(data, closed, tension) {
            if (data.length < 1) return 'M0 0'
            if (tension == null) tension = 1

            let size = data.length - (closed ? 0 : 1)
            let path = 'M' + data[0].x + ' ' + data[0].y + ' C'

            for (let i = 0; i < size; i++) {
                let p0, p1, p2, p3

                if (closed) {
                    p0 = data[(i - 1 + size) % size]
                    p1 = data[i]
                    p2 = data[(i + 1) % size]
                    p3 = data[(i + 2) % size]
                } else {
                    p0 = i == 0 ? data[0] : data[i - 1]
                    p1 = data[i]
                    p2 = data[i + 1]
                    p3 = i == size - 1 ? p2 : data[i + 2]
                }

                let x1 = p1.x + ((p2.x - p0.x) / 6) * tension
                let y1 = p1.y + ((p2.y - p0.y) / 6) * tension

                let x2 = p2.x - ((p3.x - p1.x) / 6) * tension
                let y2 = p2.y - ((p3.y - p1.y) / 6) * tension

                path += ' ' + x1 + ' ' + y1 + ' ' + x2 + ' ' + y2 + ' ' + p2.x + ' ' + p2.y
            }

            return closed ? path + 'z' : path
        }

        function random(min, max) {
            if (max == null) {
                max = min
                min = 0
            }
            if (min > max) {
                var tmp = min
                min = max
                max = tmp
            }
            return min + (max - min) * Math.random()
        }
    </script>
</body>

</html>
