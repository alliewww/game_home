<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- 濾鏡定義 -->
  <defs>
    <!-- 圓形陰影 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0, 0, 0, 0.2)"/>
    </filter>
    
    <!-- 徑向漸層：中心發光效果 -->
    <radialGradient id="radialGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#EEEDE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0CFC8;stop-opacity:1" />
    </radialGradient>
    
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="400" fill="#F4EFD7"/>

  <!-- 箭頭尖
  <polygon points="70,15 90,25 70,35" fill="#677178" transform="translate(46,24) rotate(90, 40, 0)" /> -->


  <!-- 1-3 -->
  <rect x="0" y="0" width="200" height="200" rx="30" ry="30" 
    fill="#E4DFC4" 
    stroke="#575b5e" stroke-width="10"
    transform="translate(-120, 300)  rotate(0, 60, 60)"
    filter="url(#shadow)"/>
  <rect x="0" y="0" width="200" height="200" rx="30" ry="30" 
    fill="#8C8C68" 
    transform="translate(100, 300)  rotate(0, 60, 60)"
    filter="url(#shadow)"/>  
  <rect x="0" y="0" width="200" height="200" rx="30" ry="30" 
    fill="#E4DFC4" 
    stroke="#575b5e" stroke-width="10"
    transform="translate(320, 300)  rotate(0, 60, 60)"
    filter="url(#shadow)"/>  
  <!-- 42 -->

  <rect x="0" y="0" width="270" height="270" rx="30" ry="30" 
    fill="#EACA6D" 
    stroke="#575b5e" stroke-dasharray="20,6"
    stroke-width="5" stroke-opacity="1" 
    transform="translate(106, 30)  rotate(10, 60, 60)"
    filter="url(#shadow)"/>  
  <text x="60" y="60" font-family="Georgia" font-weight="500"
    transform="translate(175, 86) rotate(10, 60, 60)"
    font-size="200" fill="#575b5e" text-anchor="middle" dominant-baseline="middle">42</text>

  <!-- 0 -->
  <text x="60" y="60" font-family="Consolas" font-weight="500"
    transform="translate(-10, 0) rotate(-20, 60, 60)"
    font-size="70" fill="#6a6f73" text-anchor="middle" 
    opacity="0.9"
    dominant-baseline="middle">1</text>
  <text x="60" y="60" font-family="Consolas" font-weight="500"
    transform="translate(10, 76) rotate(40, 60, 60)"
    font-size="100" fill="#6a6f73" text-anchor="middle" 
    opacity="0.9"
    dominant-baseline="middle">0</text>
  <text x="60" y="60" font-family="Consolas" font-weight="500"
    transform="translate(-20, 180) rotate(40, 60, 60)"
    font-size="90" fill="#6a6f73" text-anchor="middle" 
    opacity="0.9"
    dominant-baseline="middle">1</text>

  <text x="60" y="60" font-family="Consolas" font-weight="500"
    transform="translate(100, 290) rotate(-20, 60, 60)"
    font-size="85" fill="#6a6f73" text-anchor="middle" 
    opacity="0.9"
    dominant-baseline="middle">0</text>
  <text x="60" y="60" font-family="Consolas" font-weight="500"
    transform="translate(210, 270) rotate(20, 60, 60)"
    font-size="110" fill="#6a6f73" text-anchor="middle" 
    opacity="0.9"
    dominant-baseline="middle">1</text>
  <text x="60" y="60" font-family="Consolas" font-weight="500"
    transform="translate(290, 300) rotate(-10, 60, 60)"
    font-size="70" fill="#6a6f73" text-anchor="middle" 
    opacity="0.9"
    dominant-baseline="middle">0</text>

  <!--
  <text x="200" y="346" font-family="Consolas" 
        font-size="70" fill="#7b868e" text-anchor="middle" dominant-baseline="middle">2x3x7</text> -->
</svg> 