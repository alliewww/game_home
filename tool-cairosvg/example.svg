<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- 濾鏡定義 -->
  <defs>
    <!-- 圓形陰影 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0, 0, 0, 0.2)"/>
    </filter>
    
    <!-- 線性漸層：從上到下 -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F0F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EEEDE7;stop-opacity:1" />
    </linearGradient>
    
    <!-- 徑向漸層：中心發光效果 -->
    <radialGradient id="radialGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#EEEDE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0CFC8;stop-opacity:1" />
    </radialGradient>
    
    <!-- 對角線漸層：左上到右下 -->
    <linearGradient id="diagonalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F4F0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EEEDE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0DFD8;stop-opacity:1" />
    </linearGradient>
    
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#radialGradient)"/>
  
  <!-- 球形 -->
  <circle cx="200" cy="160" r="130" fill="#fac8b9" filter="url(#shadow)"/>
  <text x="200" y="140" font-family="Georgia" 
    font-size="130" fill="#677178" text-anchor="middle" dominant-baseline="middle">42</text>
  
  <!-- 中心文字 -->
  <text x="200" y="346" font-family="Consolas" 
        font-size="70" fill="#7b868e" text-anchor="middle" dominant-baseline="middle">2x3x7</text>
</svg> 