<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>就決定是你了！</title>
<style>
  :root {
    --bg1: #1b1f3b; --bg2: #2d1b4e; --card: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.14); --text: #f4f4fb; --muted: #a9a9c8;
    --good: #2ecc71; --bad: #ff5c6c; --gold: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 0%, #3b2a7a 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, #7a2a5a 0%, transparent 45%),
                linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex; justify-content: center; padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    min-height: 100dvh;
  }
  .app { width: 100%; max-width: 560px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  h1 { font-size: 1.05rem; margin: 0; letter-spacing: 1px; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .ball { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(#ff4d4d 0 46%, #222 46% 54%, #fff 54%); border: 2px solid #222; position: relative; flex: none; }
  .ball::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #fff; border: 2px solid #222; }
  .stats { display: flex; gap: 6px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .stat b { font-size: .95rem; }
  .stat span { font-size: .7rem; color: var(--muted); }
  .stat.time b { color: var(--gold); font-variant-numeric: tabular-nums; min-width: 2.4em; text-align: right; }
  .stat.time.low { border-color: var(--bad); animation: pulse 1s ease-in-out infinite; }
  .stat.time.low b { color: var(--bad); }
  .stat.time { position: relative; }
  .penalty { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); color: var(--bad); font-weight: 900; font-size: .9rem;
             white-space: nowrap; pointer-events: none; animation: penalty 1.1s ease-out forwards; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  @keyframes penalty { 0% { opacity: 0; transform: translate(-50%, -6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 14px); } }
  .penalty-note { color: var(--bad); font-size: .85rem; font-weight: 800; margin-top: 2px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(255,92,108,.3); } }
  .timebar { height: 5px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; margin: 0 0 10px; }
  .timebar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd166, #ff9f43); transform-origin: left; }
  .timebar.low i { background: var(--bad); }
  .timebar.paused i { opacity: .5; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 12px; backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .scene { --sh: clamp(200px, 30dvh, 280px); position: relative; width: 100%; height: var(--sh); border-radius: 16px; overflow: hidden;
           background: linear-gradient(180deg, rgba(140,200,255,.22) 0%, rgba(140,200,255,.06) 55%, rgba(120,210,130,.16) 100%); }
  .platform { position: absolute; left: 30%; right: 0; bottom: 14px; margin: auto; width: 250px; height: 54px; border-radius: 50%;
              background: radial-gradient(ellipse at 50% 40%, #9be07f 0%, #6cbf5a 45%, #3f8a3a 75%, #2e6a2c 100%);
              box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), 0 8px 18px rgba(0,0,0,.3); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .platform::before { content: ""; position: absolute; inset: 8px 30px 20px; border-radius: 50%; background: rgba(255,255,255,.16); }
  .img-wrap { position: absolute; left: 30%; right: 0; bottom: 30px; margin: auto; width: calc(var(--sh) - 44px); height: calc(var(--sh) - 44px); display: grid; place-items: center;
              transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .img-wrap img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom;
                  transform: translateY(var(--sink, 0%));
                  filter: brightness(1) drop-shadow(0 10px 14px rgba(0,0,0,.4)); transition: filter .3s ease;
                  border: 0; outline: 0; }
  /* Browsers draw a placeholder border for an <img> with no src, still loading, or broken; keep it invisible until a real image has loaded. */
  .img-wrap img:not(.loaded) { visibility: hidden; }
  .info { position: absolute; top: 10px; left: 10px; z-index: 2; max-width: 46%; padding: 7px 11px; border-radius: 12px;
          background: rgba(14,12,36,.6); border: 1px solid var(--border); transition: opacity .3s, transform .3s; }
  .dialog { position: relative; margin: 10px auto 0; background: #fbfbff; color: #22223a; border: 4px solid #4a4f86; border-radius: 12px;
            box-shadow: inset 0 0 0 3px #c9cdf2, 0 6px 16px rgba(0,0,0,.3); padding: 8px 30px 8px 14px; min-height: 58px;
            font-weight: 800; font-size: 1.02rem; letter-spacing: 1px; transition: opacity .2s, transform .2s; }
  .dialog .caret { position: absolute; right: 12px; bottom: 6px; font-style: normal; font-size: .7rem; color: #e64a4a; opacity: 0; }
  .dialog .ask { display: block; font-size: .8rem; font-weight: 700; color: #6a6f9a; letter-spacing: 0; margin-top: 2px; opacity: 0; transition: opacity .2s; }
  .dialog.done .ask { opacity: 1; }
  .dialog.done .caret { opacity: 1; animation: bob .8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }

  .enc:not(.s-slide) .platform { transform: translateX(115%); }
  .enc:not(.s-slide) .img-wrap { transform: translateX(-140%); }
  .enc:not(.s-reveal) .img-wrap img { filter: brightness(0) drop-shadow(0 10px 14px rgba(0,0,0,.4)); }
  .enc:not(.s-reveal) .info { opacity: 0; transform: translateY(6px); }
  .enc:not(.s-dialog) .dialog { opacity: 0; transform: translateY(8px); }
  .enc:not(.s-moves) .move { opacity: 0; transform: translateY(14px); pointer-events: none; }
  .enc .move { transition: opacity .28s ease, transform .28s ease; }
  .enc .move:nth-child(2) { transition-delay: .05s; } .enc .move:nth-child(3) { transition-delay: .1s; } .enc .move:nth-child(4) { transition-delay: .15s; }
  .no-trans, .no-trans * { transition: none !important; }

  .fx { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
  .fx.out { opacity: 0; transition: opacity .22s ease; }
  .fx .bar { position: absolute; left: 0; width: 100%; background: #0d0d16; transform: scaleX(0); animation: barIn .3s ease-in forwards; }
  @keyframes barIn { to { transform: scaleX(1); } }
  .fx .tile { position: absolute; background: #0d0d16; transform: scale(0) rotate(60deg); animation: tileIn .26s ease-out forwards; }
  @keyframes tileIn { to { transform: scale(1.08) rotate(0); } }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @property --r { syntax: "<percentage>"; inherits: false; initial-value: 100%; }
  .fx .clock { position: absolute; inset: -50vmax; background: conic-gradient(#0d0d16 var(--a), transparent 0); animation: clockIn .48s ease-in forwards, spin .48s ease-in forwards; }
  @keyframes clockIn { to { --a: 360deg; } }
  @keyframes spin { to { transform: rotate(180deg); } }
  .fx .iris { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, transparent var(--r), #0d0d16 calc(var(--r) + .5%));
              animation: irisIn .46s cubic-bezier(.6,0,.9,.6) forwards; }
  @keyframes irisIn { from { --r: 75%; } to { --r: -1%; } }

  @media (prefers-reduced-motion: reduce) {
    .platform, .img-wrap, .info, .dialog, .enc .move { transform: none !important; transition: opacity .2s ease, filter .2s ease !important; }
    .dialog.done .caret, .move.wrong { animation: none; }
  }
  .mon-name { font-size: 1.12rem; font-weight: 800; line-height: 1.2; }
  .mon-id { color: var(--muted); font-size: .68rem; }
  .types { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
  .type { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 700; font-size: .74rem; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
  .moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .move { position: relative; border: none; border-radius: 14px; padding: 11px 12px; cursor: pointer; color: #fff; text-align: left; font: inherit; overflow: hidden;
          transition: transform .12s ease, box-shadow .2s ease, opacity .2s; box-shadow: 0 6px 16px rgba(0,0,0,.25), inset 0 -3px 0 rgba(0,0,0,.2); }
  .move:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.2); }
  .move:active:not(:disabled) { transform: translateY(0); }
  .move:disabled { cursor: default; }
  .move .mname { font-size: 1.02rem; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .move .mtype { font-size: .72rem; opacity: .95; margin-top: 3px; background: rgba(0,0,0,.2); display: inline-block; padding: 2px 8px; border-radius: 999px; }
  .move .mult { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-weight: 900; font-size: 1.1rem; background: rgba(0,0,0,.35); padding: 3px 9px; border-radius: 10px; opacity: 0; transition: opacity .25s; }
  .revealed .move .mult { opacity: 1; }
  .revealed .move:not(.correct):not(.wrong) { opacity: .55; }
  .move.correct { outline: 3px solid var(--good); outline-offset: 2px; }
  .move.wrong { outline: 3px solid var(--bad); outline-offset: 2px; animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px;
           background: rgba(8,8,22,.6); opacity: 0; visibility: hidden; transition: opacity .2s, visibility 0s .2s; }
  .modal.show { opacity: 1; visibility: visible; transition: opacity .2s; }
  .sheet { position: relative; width: min(400px, 100%); text-align: center;
           background: #2a2656; border: 1px solid var(--border); border-radius: 20px;
           padding: 38px 16px 16px; margin-top: 24px; box-shadow: 0 24px 60px rgba(0,0,0,.55);
           transform: translateY(24px) scale(.96); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .modal.show .sheet { transform: none; }
  .modal.cover { padding: 0; background: #1b1f3b; place-items: stretch; z-index: 50; }
  .modal.cover .sheet { width: 100% !important; max-width: none; height: 100%; min-height: 100dvh; margin: 0; border: 0; border-radius: 0;
           background: #1b1f3b; box-shadow: none; transform: none !important; padding: 0;
           display: flex; flex-direction: column; justify-content: stretch; align-items: stretch; position: relative; }
  body.cover-open .app { visibility: hidden; }
  .modal.cover .mark { position: static; margin: 0 auto 14px; border-color: #1b1f3b; }
  .modal.cover .sheet-title { font-size: 1.7rem; }
  .modal.cover .rules, .modal.cover .record, .modal.cover .next { width: min(400px, 100%); }
  .cover-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
                padding: 28px 22px 16px; width: 100%; }
  .cover-foot { width: 100%; padding: 12px 22px calc(16px + env(safe-area-inset-bottom));
                border-top: 1px solid rgba(255,255,255,.08); text-align: center; }
  .cover-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 0; font-size: .75rem; }
  .cover-links button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; padding: 6px 10px; }
  .cover-links button:hover { color: var(--text); }
  .cover-links span { color: rgba(255,255,255,.2); }
  .cover-copy { margin: 6px 0 0; font-size: .62rem; color: rgba(255,255,255,.38); }
  .ver { position: absolute; top: 10px; right: 14px; z-index: 3; font-size: .62rem; font-weight: 600;
         color: rgba(255,255,255,.34); letter-spacing: .04em; font-variant-numeric: tabular-nums; pointer-events: none; }
  .legal-panel { display: none; position: absolute; inset: 0; z-index: 2; background: #1b1f3b;
                 padding: 0; overflow: auto; text-align: left; }
  .legal-panel.open { display: flex; flex-direction: column; }
  .legal-bar { flex: none; display: flex; align-items: center; padding: 10px 8px 10px 4px;
               border-bottom: 1px solid rgba(255,255,255,.08); background: #1b1f3b; }
  .legal-back { background: none; border: 0; color: var(--muted); font: inherit; font-size: .88rem;
                font-weight: 700; cursor: pointer; padding: 8px 12px; }
  .legal-back:hover { color: var(--text); }
  .legal-panel h3 { margin: 4px 0 4px; font-size: 1.2rem; text-align: center; letter-spacing: .04em; }
  .legal-meta { text-align: center; color: rgba(255,255,255,.38); font-size: .7rem; margin: 0 0 16px; }
  .legal-panel h4 { margin: 14px 0 6px; font-size: .86rem; color: var(--text); font-weight: 800; }
  .legal-panel p, .legal-panel li { color: var(--muted); font-size: .8rem; line-height: 1.7; font-weight: 500; }
  .legal-panel p { margin: 0 0 8px; }
  .legal-panel ul { margin: 0 0 10px; padding-left: 1.15em; }
  .legal-panel a { color: #b4c4ff; }
  .legal-inner { flex: 1; overflow: auto; max-width: 440px; width: 100%; margin: 0 auto;
                 padding: 18px 22px calc(20px + env(safe-area-inset-bottom)); }
  .mark { position: absolute; top: -28px; left: 0; right: 0; margin: auto; width: 56px; height: 56px; border-radius: 50%;
          display: grid; place-items: center; font-size: 1.7rem; font-weight: 900; color: #fff; border: 4px solid #2a2656; }
  .good .mark { background: var(--good); } .bad .mark { background: var(--bad); }
  .verdict { font-size: 1.35rem; font-weight: 800; }
  .good .verdict { color: var(--good); } .bad .verdict { color: var(--bad); }
  .streak-note { color: var(--gold); font-size: .85rem; font-weight: 700; margin-top: 2px; }
  .explain { color: var(--muted); font-size: .86rem; line-height: 1.55; margin-top: 6px; }
  .explain b { color: var(--text); }
  .explain .calc { display: block; white-space: nowrap; font-size: .8rem; }
  .neutral .mark { background: #5060e1; font-size: 1.5rem; }
  .sheet-title { font-size: 1.35rem; font-weight: 900; }
  .rules { list-style: none; padding: 0; margin: 12px 0 14px; display: grid; gap: 6px; text-align: left; font-size: .88rem; }
  .rules li { background: rgba(255,255,255,.05); border-radius: 10px; padding: 8px 11px; }
  .rules b { color: var(--gold); }
  .big-score { font-size: 3.2rem; font-weight: 900; color: var(--gold); line-height: 1; margin-top: 8px; }
  .big-score small { font-size: 1rem; color: var(--muted); font-weight: 700; margin-left: 4px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0; }
  .summary div { background: rgba(255,255,255,.05); border-radius: 10px; padding: 8px 4px; }
  .summary b { display: block; font-size: 1.1rem; }
  .summary span { font-size: .72rem; color: var(--muted); }
  .record { font-weight: 800; color: var(--muted); font-size: .9rem; }
  .record.new { color: var(--gold); }
  .res-list { list-style: none; margin: 12px 0 14px; padding: 0; display: grid; gap: 6px; }
  .res-list li { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; background: rgba(255,255,255,.05); text-align: left; font-size: .92rem; }
  .res-list .nm { flex: 1; font-weight: 700; }
  .res-list .x { font-weight: 900; min-width: 2.4em; text-align: right; }
  .res-list li.ans { background: rgba(46,204,113,.16); box-shadow: inset 0 0 0 2px var(--good); }
  .res-list li.pick { background: rgba(255,92,108,.14); box-shadow: inset 0 0 0 2px var(--bad); }
  .res-list .tag { font-size: .7rem; font-weight: 800; padding: 1px 6px; border-radius: 6px; color: #10241a; background: var(--good); }
  .res-list li.pick .tag { background: var(--bad); color: #fff; }
  .next { width: 100%; border: none; border-radius: 12px; padding: 11px 26px; font: inherit; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #ffd166, #ff9f43); color: #3b2300; box-shadow: 0 6px 16px rgba(255,159,67,.35); }
  .next:hover { filter: brightness(1.08); }
  .note { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: .72rem; }
  .legal { margin: 10px 0 0; font-size: .65rem; color: var(--muted); line-height: 1.45; font-weight: 500; }
  .hint { text-align: center; color: var(--muted); font-size: .72rem; margin-top: 10px; }
  .t-normal{background:#9fa19f}.t-fire{background:#e62829}.t-water{background:#2980ef}.t-electric{background:#e6b800}
  .t-grass{background:#3fa129}.t-ice{background:#3dcef3}.t-fighting{background:#ff8000}.t-poison{background:#9141cb}
  .t-ground{background:#915121}.t-flying{background:#81b9ef}.t-psychic{background:#ef4179}.t-bug{background:#91a119}
  .t-rock{background:#afa981}.t-ghost{background:#704170}.t-dragon{background:#5060e1}.t-dark{background:#50413f}
  .t-steel{background:#60a1b8}.t-fairy{background:#ef70ef}
  @media (max-width: 460px) {
    .scene { --sh: clamp(180px, 34dvh, 300px); }
    .img-wrap { bottom: 24px; left: 34%; }
    .platform { width: 190px; height: 44px; left: 34%; }
    .dialog { font-size: .95rem; }
    .move { padding: 10px; }
    .move .mname { font-size: .95rem; }
    .move .mult { top: 8px; transform: none; font-size: .85rem; padding: 2px 7px; }
    .hint, .t-long { display: none; }
  }
  @media (max-width: 420px) {
    .stats { gap: 4px; }
    .stat { padding: 4px 7px; gap: 3px; }
    h1 { gap: 5px; font-size: 1rem; letter-spacing: .5px; }
  }
  @media (max-width: 340px) { .stat.best { display: none; } }
  @media (prefers-reduced-motion: reduce) { .stat.time.low { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .sheet { transform: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="ball"></span>就決定是你了！</h1>
    <div class="stats">
      <div class="stat time" id="timeStat"><span aria-label="時間">⏱</span><b id="time">60.0</b></div>
      <div class="stat"><span>答對</span><b><span id="score">0</span>/<span id="rounds">0</span></b></div>
      <div class="stat best"><span>最高</span><b id="best">0</b></div>
    </div>
  </header>
  <div class="timebar" id="timebar"><i id="timeFill"></i></div>
  <main class="card enc" id="game">
    <div class="scene">
      <div class="info">
        <div class="mon-name" id="monName"></div>
        <div class="mon-id" id="monId"></div>
        <div class="types" id="monTypes"></div>
      </div>
      <div class="platform"></div>
      <div class="img-wrap"><img id="monImg" alt=""></div>
    </div>
    <div class="dialog" id="dialog"><span id="dialogText"></span><span class="ask">請選擇效果絕佳招式</span><i class="caret">▼</i></div>
    <div class="moves" id="moves"></div>
    <p class="note">※ 僅依屬性相剋計算，不考慮特性、道具等影響</p>
  </main>
  <div class="hint">限時 60 秒・答錯扣 3 秒・動畫與結果不計時・1–4 選招・Enter 下一題／跳過動畫</div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="verdict"><div class="sheet" id="sheet"></div></div>
<div class="fx" id="fx" aria-hidden="true"></div>
<script src="pokemon-data.js"></script>
<script>
const TYPES = {
  normal:"一般", fire:"火", water:"水", electric:"電", grass:"草", ice:"冰",
  fighting:"格鬥", poison:"毒", ground:"地面", flying:"飛行", psychic:"超能力", bug:"蟲",
  rock:"岩石", ghost:"幽靈", dragon:"龍", dark:"惡", steel:"鋼", fairy:"妖精"
};
const TYPE_KEYS = Object.keys(TYPES);

// attacker -> defender -> multiplier (omitted entries are 1)
const CHART = {
  normal:{rock:.5,ghost:0,steel:.5},
  fire:{fire:.5,water:.5,grass:2,ice:2,bug:2,rock:.5,dragon:.5,steel:2},
  water:{fire:2,water:.5,grass:.5,ground:2,rock:2,dragon:.5},
  electric:{water:2,electric:.5,grass:.5,ground:0,flying:2,dragon:.5},
  grass:{fire:.5,water:2,grass:.5,poison:.5,ground:2,flying:.5,bug:.5,rock:2,dragon:.5,steel:.5},
  ice:{fire:.5,water:.5,grass:2,ice:.5,ground:2,flying:2,dragon:2,steel:.5},
  fighting:{normal:2,ice:2,poison:.5,flying:.5,psychic:.5,bug:.5,rock:2,ghost:0,dark:2,steel:2,fairy:.5},
  poison:{grass:2,poison:.5,ground:.5,rock:.5,ghost:.5,steel:0,fairy:2},
  ground:{fire:2,electric:2,grass:.5,poison:2,flying:0,bug:.5,rock:2,steel:2},
  flying:{electric:.5,grass:2,fighting:2,bug:2,rock:.5,steel:.5},
  psychic:{fighting:2,poison:2,psychic:.5,dark:0,steel:.5},
  bug:{fire:.5,grass:2,fighting:.5,poison:.5,flying:.5,psychic:2,ghost:.5,dark:2,steel:.5,fairy:.5},
  rock:{fire:2,ice:2,fighting:.5,ground:.5,flying:2,bug:2,steel:.5},
  ghost:{normal:0,psychic:2,ghost:2,dark:.5},
  dragon:{dragon:2,steel:.5,fairy:0},
  dark:{fighting:.5,psychic:2,ghost:2,dark:.5,fairy:.5},

const POKEMON = window.POKEMON_DATA.map(([id, name, t1, t2]) => ({ id, name, types: t2 ? [t1, t2] : [t1] }));

function effectiveness(atk, defTypes) {
  return defTypes.reduce((m, d) => m * (CHART[atk][d] ?? 1), 1);
}
const fmt = m => "×" + (m === 0.25 ? "¼" : m === 0.5 ? "½" : m);
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function describe(m) {
  if (m === 0) return "沒有效果";
  if (m >= 4) return "效果超絕";
  if (m >= 2) return "效果絕佳";
  if (m === 1) return "普通效果";
  return "效果不好";
}

/* Round generation:
   1. Pick a random Pokémon and compute the multiplier of all 18 attacking types against it.
   2. The answer is always a super-effective type (×2 or ×4).
   3. Pick 3 distractors from types that are not super effective (×1 or lower),
      so the answer is the only super-effective move and the unique maximum. */
function generateRound(lastId) {
  for (;;) {
    const mon = rand(POKEMON);
    if (mon.id === lastId) continue;
    const mults = TYPE_KEYS.map(t => ({ type: t, mult: effectiveness(t, mon.types) }));
    const strong = mults.filter(c => c.mult >= 2);
    const weak = mults.filter(c => c.mult < 2);
    if (!strong.length || weak.length < 3) continue;
    const answer = rand(strong);
    const lower = shuffle(weak).slice(0, 3);
    const options = shuffle([answer, ...lower]).map(o => ({ ...o, move: rand(MOVES[o.type]) }));
    return { mon, options, answerType: answer.type };
  }
}

const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#222" stroke-width="5"/><path d="M6 50a44 44 0 0 1 88 0z" fill="#ff4d4d" stroke="#222" stroke-width="5"/><circle cx="50" cy="50" r="13" fill="#fff" stroke="#222" stroke-width="5"/><text x="50" y="96" font-size="9" text-anchor="middle" fill="#aaa">圖片無法載入</text></svg>`);

function typeBadge(t) { return `<span class="type t-${t}">${TYPES[t]}</span>`; }

function renderStats() {

function renderTime() {
  const low = state.phase === "playing" && state.timeLeft <= 10;

let lastTick = performance.now();
function tick(now) {
  // Cap dt so a backgrounded tab (rAF paused) doesn't drain the clock in one jump.
  const dt = Math.min(now - lastTick, 250) / 1000;
  lastTick = now;
  if (state.phase === "playing" && state.timerRunning) {
    state.timeLeft = Math.max(0, state.timeLeft - dt);
    if (state.timeLeft === 0) timeUp();
  }
  renderTime();
  requestAnimationFrame(tick);
}

const spriteUrl = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;

function preload(url, timeoutMs) {
  return new Promise(resolve => {
    const im = new Image();
    const t = setTimeout(() => resolve(false), timeoutMs);
    im.onload = () => { clearTimeout(t); resolve(true); };
    im.onerror = () => { clearTimeout(t); resolve(false); };
    im.src = url;
  });
}

const STAGES = ["s-slide", "s-reveal", "s-dialog", "s-moves"];
let enc = null;

function buildWipe() {
  const fx = $("fx");
  const kind = rand(["stripes", "shatter", "clock", "iris"]);
  let html = "";
  if (kind === "stripes") {
    const n = 12;
    for (let i = 0; i < n; i++)
      html += `<div class="bar" style="top:${i * 100 / n}%;height:${100 / n + .4}%;transform-origin:${i % 2 ? "right" : "left"};animation-delay:${i * 22}ms"></div>`;
  } else if (kind === "shatter") {
    const cols = 8, rows = 6;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      html += `<div class="tile" style="left:${c * 100 / cols}%;top:${r * 100 / rows}%;width:${100 / cols + .3}%;height:${100 / rows + .3}%;animation-delay:${Math.floor(Math.random() * 230)}ms"></div>`;
  } else {
    html = `<div class="${kind}"></div>`;
  }
  fx.insertAdjacentHTML("beforeend", html);
  return kind;
}

function clearFx() { const fx = $("fx"); fx.className = "fx"; fx.innerHTML = ""; }

function skipEncounter() { if (enc && !enc.done) { enc.skipped = true; enc.wake?.(); } }

function newRound() {
  closeModal();
  if (enc) { enc.cancelled = true; enc.wake?.(); }
  const round = generateRound(state.round?.mon.id);
  state.round = round;
  state.answered = false;
  state.animating = true;
  const e = enc = { done: false, skipped: false, cancelled: false, wake: null, rendered: false };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const imgReady = preload(spriteUrl(round.mon.id), 2500);
  // Resolves true after ms, or false immediately when the encounter is skipped/cancelled.
  const sleep = ms => new Promise(r => {
    if (e.skipped || e.cancelled) return r(false);
    const t = setTimeout(() => { e.wake = null; r(true); }, ms);
    e.wake = () => { clearTimeout(t); e.wake = null; r(false); };
  });
  const game = $("game"), dialog = $("dialog"), text = `野生的${round.mon.name}出現了！`;
  const render = () => {
    if (e.rendered) return;
    e.rendered = true;
    game.classList.add("no-trans");
    game.classList.remove(...STAGES);
    game.classList.add("enc");
    dialog.classList.remove("done");
    $("dialogText").textContent = "";
    renderRound();
    void game.offsetWidth;
    game.classList.remove("no-trans");
  };
  const finish = () => {
    if (e.cancelled) return;
    render();
    clearFx();
    game.classList.add(...STAGES);
    $("dialogText").textContent = text;
    dialog.classList.add("done");
    e.done = true;
    state.animating = false;
    state.timerRunning = state.phase === "playing";
    setTimeout(() => { if (enc === e) game.classList.remove("enc", ...STAGES); }, 450);
  };
  (async () => {
    clearFx();
    if (!reduce) {
      buildWipe();
      if (!await sleep(560)) return finish();
    }
    render();
    const img = $("monImg");
    const shown = new Promise(r => {
      if (img.classList.contains("loaded")) return r();
      const t = setTimeout(r, 2500);
      img.addEventListener("load", () => { clearTimeout(t); r(); }, { once: true });
    });
    await Promise.race([imgReady.then(() => shown), new Promise(r => { const w = e.wake; e.wake = () => { w?.(); r(); }; })]);
    if (e.cancelled) return;
    if (e.skipped) return finish();
    if (reduce) {
      game.classList.add(...STAGES);
      $("dialogText").textContent = text;
      return finish();
    }
    $("fx").classList.add("out");
    game.classList.add("s-slide");
    if (!await sleep(520)) return finish();
    clearFx();
    game.classList.add("s-reveal");
    if (!await sleep(320)) return finish();
    game.classList.add("s-dialog");
    for (let i = 1; i <= text.length; i++) {
      $("dialogText").textContent = text.slice(0, i);
      if (!await sleep(34)) return finish();
    }
    if (!await sleep(120)) return finish();
    finish();
  })();
}

function plantSprite(img) {
  img.style.setProperty("--sink", "0%");
  if (!img.naturalWidth) return;
  try {
    const c = document.createElement("canvas");
    const w = img.naturalWidth, h = img.naturalHeight;
    c.width = w; c.height = h;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    const { data } = ctx.getImageData(0, 0, w, h);
    for (let y = h - 1; y >= 0; y--) {
      const row = y * w * 4;
      for (let x = 0; x < w; x++) {
        if (data[row + x * 4 + 3] > 16) {
          const sink = Math.min(28, (h - 1 - y) / h * 100);
          img.style.setProperty("--sink", sink.toFixed(2) + "%");
          return;
        }
      }
    }
  } catch (_) {}
}

function renderRound() {
  const { mon, options } = state.round;
  const img = $("monImg");
  img.classList.remove("loaded");
  img.style.setProperty("--sink", "0%");
  img.crossOrigin = "anonymous";
  img.onload = () => { if (img.naturalWidth) { img.classList.add("loaded"); plantSprite(img); } };
  img.onerror = () => { img.onerror = null; img.removeAttribute("crossorigin"); img.src = FALLBACK; };
  img.alt = mon.name;
  img.src = spriteUrl(mon.id);
  if (img.complete && img.naturalWidth) { img.classList.add("loaded"); plantSprite(img); }
  $("monName").textContent = mon.name;
  $("monId").textContent = "No." + String(mon.id).padStart(4, "0");
  $("monTypes").innerHTML = mon.types.map(typeBadge).join("");
  $("game").classList.remove("revealed");
  $("moves").innerHTML = options.map((o, i) => `
    <button class="move t-${o.type}" data-i="${i}" data-type="${o.type}" data-mult="${o.mult}">
      <div class="mname">${o.move}</div>
      <div class="mtype">${TYPES[o.type]}屬性</div>
      <div class="mult">${fmt(o.mult)}</div>
    </button>`).join("");
  $("moves").querySelectorAll(".move").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i)));
}

function closeModal() {
  clearTimeout(state.modalTimer);
  state.modalKind = null;
  $("modal").classList.remove("show", "cover");

function showModal(kind, cls, html, btnId, onClick, delay = 0) {
  const sheet = $("sheet");
  $("modal").classList.toggle("cover", kind === "start");
  document.body.classList.toggle("cover-open", kind === "start");
  sheet.className = "sheet " + cls;
  sheet.innerHTML = html;
  $(btnId).addEventListener("click", ev => { ev.stopPropagation(); onClick(); });
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  clearTimeout(state.modalTimer);
  state.modalTimer = setTimeout(() => {
    state.modalKind = kind;
    $("modal").classList.add("show");
    $(btnId).focus({ preventScroll: true });
  }, reduce ? 0 : delay);
}

function timeUp() {
  state.timerRunning = false;
  state.phase = "over";
  state.answered = true;
  const { options, answerType } = state.round;
  $("game").classList.add("revealed");
  $("moves").querySelectorAll(".move").forEach((b, j) => {
    b.disabled = true;
    if (options[j].type === answerType) b.classList.add("correct");
  });
  $("dialog").classList.remove("done");
  $("dialogText").textContent = "時間到！";
  const newRecord = state.score > state.best;
  if (newRecord) { state.best = state.score; localStorage.setItem("ptq-best-timed", state.best); }
  renderStats();
  const acc = state.rounds ? Math.round(state.score / state.rounds * 100) : 0;
  showModal("result", "neutral", `
    <div class="mark">🏁</div>
    <div class="sheet-title" id="verdict">時間到！</div>
    <div class="big-score">${state.score}<small>題答對</small></div>
    <div class="summary">
      <div><b>${state.rounds}</b><span>作答題數</span></div>
      <div><b>${acc}%</b><span>正確率</span></div>
      <div><b>${state.maxStreak}</b><span>最長連勝</span></div>
    </div>
    <div class="record ${newRecord ? "new" : ""}">${newRecord ? "🎉 新紀錄！" : `最高紀錄：${state.best} 題`}</div>
    <button class="next" id="startBtn" style="margin-top:12px">再玩一次</button>`, "startBtn", startGame, 700);
}

function choose(i) {
  if (state.phase !== "playing" || state.answered || state.animating) return;
  state.answered = true;
  state.timerRunning = false;
  const { mon, options, answerType } = state.round;
  const picked = options[i];
  const ok = picked.type === answerType;
  const answer = options.find(o => o.type === answerType);
  state.rounds++;
  if (ok) { state.score++; state.streak++; state.maxStreak = Math.max(state.maxStreak, state.streak); }
  else {
    state.streak = 0;
    state.timeLeft = Math.max(0, state.timeLeft - PENALTY);
    $("timeStat").insertAdjacentHTML("beforeend", `<span class="penalty">−${PENALTY} 秒</span>`);
    setTimeout(() => $("timeStat").querySelector(".penalty")?.remove(), 1200);
  }
  renderStats();
  $("game").classList.add("revealed");
  const btns = $("moves").querySelectorAll(".move");
  btns.forEach((b, j) => {
    b.disabled = true;
    if (options[j].type === answerType) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
  });
  if (state.timeLeft === 0) return timeUp();
  const breakdown = mon.types.length > 1
    ? `<span class="calc">${mon.types.map(t => `${TYPES[t]} ${fmt(CHART[answerType][t] ?? 1)}`).join(" × ")} = ${fmt(answer.mult)}</span>` : "";
  showModal("answer", ok ? "good" : "bad", `
    <div class="mark">${ok ? "✓" : "✕"}</div>
    <div class="verdict" id="verdict">${ok ? "答對了！" : "答錯了！"}</div>
    ${ok && state.streak >= 2 ? `<div class="streak-note">🔥 ${state.streak} 連勝中</div>` : ""}
    ${ok ? "" : `<div class="penalty-note">⏱ −${PENALTY} 秒</div>`}
    <div class="explain"><b>${answer.move}</b>（${TYPES[answerType]}）對 ${mon.name} ${fmt(answer.mult)} ${describe(answer.mult)}${breakdown}</div>
    <ul class="res-list">
      ${options.map((o, j) => `<li class="${o.type === answerType ? "ans" : j === i ? "pick" : ""}">
        <span class="type t-${o.type}">${TYPES[o.type]}</span><span class="nm">${o.move}</span>
        ${o.type === answerType ? `<span class="tag">正解</span>` : j === i ? `<span class="tag">你的選擇</span>` : ""}
        <span class="x">${fmt(o.mult)}</span></li>`).join("")}
    </ul>
    <button class="next" id="nextBtn">下一題 →</button>`, "nextBtn", nextQuestion, 450);
}

function nextQuestion() { if (state.phase === "playing" && state.answered && !state.animating) newRound(); }

document.addEventListener("keydown", e => {
  if (state.animating) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); skipEncounter(); }
    return;
  }
  if (e.key === "Escape" && coverPanelOpen()) { e.preventDefault(); closeCoverPanels(); return; }
  const confirm = e.key === "Enter" || e.key === " ";
  if (confirm && coverPanelOpen()) return;
  if (confirm && (state.modalKind === "start" || state.modalKind === "result")) { e.preventDefault(); startGame(); }
  else if (["1","2","3","4"].includes(e.key)) choose(+e.key - 1);
  else if (confirm && state.answered) { e.preventDefault(); nextQuestion(); }
});

document.addEventListener("click", () => { if (state.animating) skipEncounter(); });

window.__quiz = { CHART, POKEMON, effectiveness, generateRound, newRound, state, choose, startGame, timeUp };
renderStats();
requestAnimationFrame(tick);
showStart();
</script>
</body>
</html>
